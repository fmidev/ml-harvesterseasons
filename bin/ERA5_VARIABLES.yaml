# SmartMet parameter definitions for ERA5 available variables 
# smartmet: parameter FMI key on smartmet server
# name: name of the variable
# units: available units
# tsteps: available time steps (in hours) to query
# unified ml names drop producer from these
# unit conversions (to target prediction type - ec-ens etc)
# areas = europe, india-himalayas, etc 

