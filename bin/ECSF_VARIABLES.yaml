# SmartMet parameter definitions for ECSF available variables on sm.cryo-scope.eu and smartmet.xyz
# fmikey: parameter FMI key (for different levels, pl = pressure level in hPa, sl = soil layer in cm) on smartmet server
# name: name of the variable
# units: available units
# tsteps: available time steps (in hours) to query
# areas: eu = europe, in = india-himalayas, etc.

instant:
  wdir_ecsf:
    in: 
      source: sm.cryo-scope.eu
      tsteps: [0, 12]
      fmikeys: 
        pl-500: "DD-D:ECSF:5094:2:500:1:0"
        pl-700: "DD-D:ECSF:5094:2:700:1:0"
        pl-850: "DD-D:ECSF:5094:2:850:1:0"
        pl-925: "DD-D:ECSF:5094:2:925:1:0"
    eu: 
      source: smartmet.xyz
      tsteps: [0, 12]
      fmikeys: 
        pl-500: "DD-D:ECSF:5103:2:500:1:0"
        pl-700: "DD-D:ECSF:5103:2:700:1:0"
        pl-850: "DD-D:ECSF:5103:2:850:1:0"
